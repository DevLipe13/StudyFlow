quarkus.http.port=${QUARKUS_HTTP_PORT:8081}
quarkus.application.name=studyflow-backend

# Datasource — credentials via environment only
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

# Hibernate + Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.mapping.timezone.default-storage=normalize-utc
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# OIDC / Keycloak (resource server)
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CLIENT_SECRET}
quarkus.oidc.tls.verification=none
quarkus.http.auth.permission.public.paths=/api/v1/health
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Keycloak Admin REST client — secrets via environment only
quarkus.keycloak.admin-client.server-url=${KC_SERVER_URL}
quarkus.keycloak.admin-client.realm=${KC_REALM}
quarkus.keycloak.admin-client.client-id=${KC_ADMIN_CLIENT_ID}
quarkus.keycloak.admin-client.client-secret=${KC_ADMIN_CLIENT_SECRET}
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

studyflow.keycloak.realm=${KC_REALM}

# JWT roles from Keycloak realm_access.roles
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Test profile: in-memory H2 without real secrets
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:studyflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.oidc.auth-server-url=http://localhost:8080/realms/studyflow
%test.quarkus.oidc.client-id=studyflow-api
%test.quarkus.oidc.credentials.secret=test-secret
%test.quarkus.oidc.tls.verification=none
%test.KC_SERVER_URL=http://localhost:8080
%test.KC_REALM=studyflow
%test.KC_ADMIN_CLIENT_ID=studyflow-admin-cli
%test.KC_ADMIN_CLIENT_SECRET=test-secret
%test.quarkus.keycloak.admin-client.server-url=http://localhost:8080
%test.quarkus.keycloak.admin-client.realm=studyflow
%test.quarkus.keycloak.admin-client.client-id=studyflow-admin-cli
%test.quarkus.keycloak.admin-client.client-secret=test-secret
